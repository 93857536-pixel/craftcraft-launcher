[package]
name = "craftcraft"
version = "0.3.1"
description = "CraftCraft Launcher - modern cross-platform Minecraft launcher"
authors = ["LinMinHao"]
license = "MIT"
repository = "https://github.com/93857536-pixel/craftcraft-launcher"
edition = "2021"
default-run = "craftcraft"

[lib]
name = "craftcraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["stream"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "fs", "io-util"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "v5"] }
chrono = "0.4"
anyhow = "1"
dirs = "6"
zip = "2"
md-5 = "0.10"

[features]
custom-protocol = ["tauri/custom-protocol"]
# 开发/自测工具开关：不加这个 feature 时，smoke 与 relay-push 不会被构建，
# 也就不会被 tauri bundle 打进 .app（否则用户会拿到 4.8MB 的测试二进制）。
dev-tools = []

[[bin]]
name = "relay-push"
path = "src/bin/relay_push.rs"
required-features = ["dev-tools"]

[[bin]]
name = "smoke"
path = "src/bin/smoke.rs"
required-features = ["dev-tools"]
